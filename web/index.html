<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:">
  <title>Aerie</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/aerie.css">
</head>
<body>
  <div id="bg" aria-hidden="true">
    <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
    <video id="bg-video" muted loop playsinline hidden></video>
  </div>
  <canvas id="scene" aria-label="3D desktop scene"></canvas>
  <div id="wall" aria-hidden="true" hidden></div>
  <div id="vignette" aria-hidden="true"></div>
  <div id="grain" aria-hidden="true"></div>
  <main id="widgets" aria-label="Desktop widgets"></main>
  <div id="drawer" hidden></div>

  <div id="toast" role="status" aria-live="polite" hidden></div>
  <div id="quickmenu" class="quickmenu"></div>
  <div id="arrange-bar" role="toolbar" aria-label="Moving widgets" hidden>
    <span>Drag widgets to move them · drag the corner to resize · hold Shift to snap</span>
    <button type="button">Done</button>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
