<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; frame-src 'self'; connect-src 'self' blob: data:">
  <title>Aerie Studio</title>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/ui.css">
  <link rel="stylesheet" href="css/studio.css">
</head>
<body class="ui studio">
  <a class="skip" href="#main">Skip to content</a>
  <header class="st-top">
    <div class="st-brand"><img src="img/aerie.svg" alt=""><b>Aerie</b><span class="kana">スタジオ</span></div>
    <nav id="nav" class="pills st-nav" role="tablist" aria-label="Pages"></nav>
    <div class="st-top-end"><button class="btn ghost" id="cmd" type="button" aria-keyshortcuts="Control+K"></button><span id="foot" class="small muted tnum"></span></div>
  </header>
  <div class="st-body">
    <main class="st-main" id="main" tabindex="-1">
      <div class="st-head">
        <div><h1 id="title"></h1><p class="muted" id="subtitle"></p></div>
        <div class="st-tools" id="tools"></div>
      </div>
      <div id="page" class="st-page"></div>
    </main>
    <aside class="st-inspector" aria-label="Preview and details">
      <div class="pv-head"><span class="kana">プレビュー</span><span class="small muted" id="pv-label">Preview</span></div>
      <div class="pv-frame" data-sq="12"><iframe id="preview" title="Live preview of your desktop" tabindex="-1"></iframe></div>
      <div id="details" class="pv-details"></div>
    </aside>
  </div>
  <div id="drop" class="st-drop" hidden><div><span id="drop-icon"></span><b>Drop to add to your library</b><small>Pictures, GIFs, videos, Blender .glb scenes, shaders (.glsl), web pages, Wallpaper Engine or Lively folders, .zip files</small><small>Only add wallpapers you made or have the right to use. They stay on this computer.</small></div></div>
  <script type="module" src="js/studio.js"></script>
</body>
</html>
