# Runs Aerie for real on every push: under a headless Wayland desktop (sway, which supports
# the same layer-shell and session-lock protocols as COSMIC), it plays the bundled shader, an
# imported Blender scene and the 2D parallax scene, opens Aerie Studio, locks and unlocks the
# screen with a password, and saves
# screenshots and logs (Actions → Checks → the run → Artifacts).
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Also put the screenshots on the ci-screenshots branch (easy to view)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  run-aerie:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Unit tests
        run: |
          (sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends python3-numpy) >/dev/null 2>&1 || true
          python3 tests/test_desktop_watch.py
          python3 tests/test_wetex.py
          python3 tests/test_library.py
          python3 tests/test_replies.py
          python3 tests/test_making.py
          node tests/test_motion.mjs

      - name: Install a headless desktop and Aerie's libraries
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends sway grim wtype xwayland python3-numpy \
            python3-gi gir1.2-gtk-4.0 gir1.2-webkit-6.0 libgl1-mesa-dri mesa-utils \
            meson ninja-build gcc pkg-config libgtk-4-dev libwayland-dev wayland-protocols \
            gobject-introspection libgirepository1.0-dev fonts-noto-cjk dbus-x11 \
            gstreamer1.0-libav gstreamer1.0-plugins-good
          # GitHub's runner stops programs from making the user namespaces WebKit's sandbox
          # needs (Pop!_OS allows them); allow them here so pages run sandboxed as on Pop
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Build gtk4-layer-shell
        run: |
          set -e
          git clone --quiet --depth 1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/gls
          meson setup /tmp/gls/_build /tmp/gls --prefix="$PWD/build/layer-shell-v1.3.0" --libdir=lib \
            -Dexamples=false -Ddocs=false -Dtests=false -Dsmoke-tests=false -Dvapi=false -Dintrospection=true
          ninja -C /tmp/gls/_build install >/dev/null
          ls build/layer-shell-v1.3.0/lib/girepository-1.0

      - name: Run Aerie under sway
        timeout-minutes: 8
        env:
          XDG_RUNTIME_DIR: /tmp/rt
          WLR_BACKENDS: headless
          WLR_RENDERER: pixman
          WLR_LIBINPUT_NO_DEVICES: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: tests/run_under_sway.sh

      - name: Show what happened
        if: always()
        run: |
          # one note per file (GitHub shows at most 10 notes per step)
          for f in shots/run.log shots/aerie.log shots/aerie-lock.log shots/aerie.out shots/lock.out; do
            [ -s "$f" ] && echo "::notice title=$(basename "$f")::$(tail -n 40 "$f" | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          done || true

      - name: Publish screenshots to the ci-screenshots branch
        if: always() && github.event_name == 'workflow_dispatch' && inputs.publish
        run: |
          cd shots
          git init -q -b ci-screenshots
          git -c user.name=ci -c user.email=ci@users.noreply.github.com add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aerie-screenshots
          path: shots/
